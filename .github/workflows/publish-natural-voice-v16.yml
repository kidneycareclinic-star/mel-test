name: Publish tested natural voice preview v16
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-natural-voice-v16.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact tested preview and stage only public assets
        run: |
          git diff --exit-code 4fdbe5fcaaa19054e2cb899a9af3a9c703d18fa9 HEAD -- preview/
          mkdir -p "$RUNNER_TEMP/natural-voice-preview/preview"
          cp -R preview/. "$RUNNER_TEMP/natural-voice-preview/preview/"
          cat > "$RUNNER_TEMP/natural-voice-preview/index.html" <<'HTML'
          <!doctype html><html lang="en"><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=./preview/"><title>KidneyCare preview</title><a href="./preview/">Open the synthetic EHR preview</a></html>
          HTML
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/natural-voice-preview
      - id: deployment
        uses: actions/deploy-pages@v4
