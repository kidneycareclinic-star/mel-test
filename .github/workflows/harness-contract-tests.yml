name: Harness contract tests

on:
  push:
    branches:
      - agentic-harness-tabs
      - clinician-gateway-cutover
      - astra-ultrafast-gateway
      - encounter-state-v4
      - encounter-completion-v5
      - follow-up-queue-v6
      - soap-scribe-v7
      - scribe-profile-v8
      - encounter-coordinator-v9a
      - agent-dot-interface-v10a
      - clinical-actions-v10b
      - background-orchestrator-v11
      - encounter-attention-v12
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: JavaScript syntax
        run: |
          node --check backend-patient-loader.js
          node --check clinician-auth-ui.js
          node --check prechart-workspace.js
          node --check scribe-review-ui.js
          node --check encounter-workflow-ui.js
          node --check workspace-review-ui.js
          node --check workflow-prep-ui.js
          node --check activity-audit-ui.js
          node --check patient-state.js
          node --check encounter-completion-ui.js
          node --check follow-up-queue-ui.js
          node --check recorded-audio-ui.js
          node --check microphone-meter.js
          node --check note-drafting-ui.js
          node --check encounter-coordinator-ui.js
          node --check agent-map-ui.js
          node --check encounter-actions-ui.js
          node --check encounter-inbox-ui.js
      - name: Harness contracts
        run: node scripts/harness-contract-tests.mjs
      - name: Scribe review safety
        run: node scripts/scribe-review-safety-tests.mjs
      - name: Synthetic encounter review safety
        run: node scripts/encounter-workflow-tests.mjs
      - name: Clinician access safety
        run: node scripts/clinician-auth-tests.mjs
      - name: Clinician sign-in UI
        run: node scripts/clinician-auth-ui-tests.mjs
      - name: Encounter State v4 safety
        run: node scripts/encounter-state-v4-tests.mjs
      - name: Astra gateway safety
        run: node scripts/astra-gateway-tests.mjs
      - name: Visit completion safety
        run: node scripts/encounter-completion-tests.mjs
      - name: Follow-up queue safety
        run: node scripts/follow-up-queue-tests.mjs

      - name: Audio transcription wire contract and gates
        run: node scripts/audio-transcription-tests.mjs
      - name: Physician drafting wire contract and source gates
        run: node scripts/note-drafting-tests.mjs
      - name: Source-linked clinical action contracts
        run: node scripts/clinical-actions-tests.mjs
      - name: Background worker boundary
        run: node scripts/encounter-worker-tests.mjs
      - name: SOAP and transcript fidelity safety
        run: node scripts/soap-scribe-tests.mjs

  jsonb-driver:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: encounter_jsonb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install the exact deployed Postgres.js version
        run: npm install --prefix "$RUNNER_TEMP/jsonb-driver" --ignore-scripts --no-audit --no-fund postgres@3.4.7 jsdom@26.1.0
      - name: Real driver draft and signing regression
        env:
          ENCOUNTER_TEST_DB_URL: postgres://postgres:synthetic-ci-only@127.0.0.1:5432/encounter_jsonb_test
        run: POSTGRES_DRIVER_PATH="$RUNNER_TEMP/jsonb-driver/node_modules/postgres/src/index.js" node scripts/encounter-jsonb-driver-tests.mjs
      - name: Visit completion DOM regression
        run: DOM_TEST_MODULE="$RUNNER_TEMP/jsonb-driver/node_modules/jsdom/lib/api.js" node scripts/encounter-completion-ui-tests.mjs
      - name: Follow-up queue DOM regression
        run: DOM_TEST_MODULE="$RUNNER_TEMP/jsonb-driver/node_modules/jsdom/lib/api.js" node scripts/follow-up-queue-ui-tests.mjs
      - name: Recorded audio and browser transcription DOM
        run: DOM_TEST_MODULE="$RUNNER_TEMP/jsonb-driver/node_modules/jsdom/lib/api.js" node scripts/recorded-audio-ui-tests.mjs

      - name: Physician note profiles and preview DOM
        run: DOM_TEST_MODULE="$RUNNER_TEMP/jsonb-driver/node_modules/jsdom/lib/api.js" node scripts/note-drafting-ui-tests.mjs

      - name: Consolidated encounter review DOM
        run: DOM_TEST_MODULE="$RUNNER_TEMP/jsonb-driver/node_modules/jsdom/lib/api.js" node scripts/encounter-coordinator-ui-tests.mjs

      - name: Durable orchestration UI
        run: DOM_TEST_MODULE="$RUNNER_TEMP/jsonb-driver/node_modules/jsdom/lib/api.js" node scripts/encounter-orchestrator-ui-tests.mjs

      - name: Action decisions and instruction synchronization DOM
        run: DOM_TEST_MODULE="$RUNNER_TEMP/jsonb-driver/node_modules/jsdom/lib/api.js" node scripts/encounter-actions-ui-tests.mjs

      - name: Automatic transcription handoff DOM
        run: DOM_TEST_MODULE="$RUNNER_TEMP/jsonb-driver/node_modules/jsdom/lib/api.js" node scripts/encounter-coordinator-audio-ui-tests.mjs

      - name: Encounter inbox navigation DOM
        run: DOM_TEST_MODULE="$RUNNER_TEMP/jsonb-driver/node_modules/jsdom/lib/api.js" node scripts/encounter-inbox-ui-tests.mjs

      - name: Hierarchical agent-dot navigation DOM
        run: DOM_TEST_MODULE="$RUNNER_TEMP/jsonb-driver/node_modules/jsdom/lib/api.js" node scripts/agent-map-ui-tests.mjs

  agent-map-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install browser verification tools
        run: npm install --prefix "$RUNNER_TEMP/agent-map-browser" --ignore-scripts --no-audit --no-fund playwright@1.62.1
      - name: Install Chromium
        run: node "$RUNNER_TEMP/agent-map-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check agent map themes and responsive targets
        run: PLAYWRIGHT_TEST_MODULE="$RUNNER_TEMP/agent-map-browser/node_modules/playwright/index.mjs" node scripts/agent-map-browser-tests.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-map-browser-screenshots
          path: agent-map-screenshots/
