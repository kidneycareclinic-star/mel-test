name: Deploy stable + development preview

on:
  push:
    branches:
      - main
      - agentic-harness-tabs
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout stable main site
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: agentic-harness-tabs
          path: preview-source

      - name: Build combined Pages artifact
        run: |
          mkdir -p site/preview
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            preview-source/ site/preview/
          touch site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
